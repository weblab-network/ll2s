name: Publish LL2S container
on:
  push:
    # Frozen OVS patch variants use patched-release.yml instead of rebuilding.
    tags: ['v*', '!v*-ovs-*']
permissions:
  contents: read
concurrency:
  group: ll2s-container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check version and unit tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,ll2s; assert os.environ["RELEASE_TAG"] == "v" + ll2s.__version__'
          python3 -m unittest discover -s tests -v
          python3 -m ll2s.cli --check -f examples/switch.conf
      - name: Build release image
        run: docker build --pull -t ll2s-release:test .
      - name: Test installed package and native capabilities
        run: |
          docker run --rm --network none -v "$PWD/tests:/tests:ro" -v "$PWD/packaging:/packaging:ro" -w /tmp --entrypoint python3 ll2s-release:test -m unittest discover -s /tests -v
          sudo modprobe openvswitch
          docker run --rm --network none --cap-add NET_ADMIN --cap-add NET_RAW -v "$PWD/tests:/tests:ro" ll2s-release:test python3 /tests/capabilities.py
      - name: Collect verified dependency sources
        run: |
          mkdir -p sources
          docker run --rm --entrypoint sh -v "$PWD/packaging:/packaging:ro" -v "$PWD/sources:/out" ll2s-release:test -ec '
            cp /lib/apk/db/installed /tmp/runtime-installed
            apk add --no-cache abuild git build-base
            python3 -u /packaging/collect_sources.py /tmp/runtime-installed /out/dependencies
            cp -a /usr/share/ll2s/ovs-rstp-test /out/dependencies/ovs-override
          '
          tar -czf ll2s-dependency-sources.tar.gz -C sources dependencies
          sha256sum ll2s-dependency-sources.tar.gz > SHA256SUMS
      - name: Publish accompanying sources
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "LL2S $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" ll2s-dependency-sources.tar.gz SHA256SUMS
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag ll2s-release:test "$image:${RELEASE_TAG#v}"
          docker push "$image:${RELEASE_TAG#v}"
          docker tag ll2s-release:test "$image:latest"
          docker push "$image:latest"
